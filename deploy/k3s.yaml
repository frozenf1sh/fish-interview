apiVersion: v1
kind: Namespace
metadata:
  name: fish-interview
  labels:
    app.kubernetes.io/part-of: fish-interview
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fish-interview
  namespace: fish-interview
  labels:
    app.kubernetes.io/name: fish-interview
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fish-interview
  namespace: fish-interview
  labels:
    app.kubernetes.io/name: fish-interview
    app.kubernetes.io/part-of: fish-interview
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: fish-interview
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fish-interview
        app.kubernetes.io/part-of: fish-interview
    spec:
      serviceAccountName: fish-interview
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: fish-interview:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: fish-interview
  namespace: fish-interview
  labels:
    app.kubernetes.io/name: fish-interview
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fish-interview
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: fish-interview
  labels:
    app.kubernetes.io/name: fish-interview
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: fish-interview
  labels:
    app.kubernetes.io/name: fish-interview
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
    referrerPolicy: strict-origin-when-cross-origin
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fish-interview
  namespace: fish-interview
  labels:
    app.kubernetes.io/name: fish-interview
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns01
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: fish-interview-redirect-https@kubernetescrd,fish-interview-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: code.frozenf1sh.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fish-interview
                port:
                  name: http
  tls:
    - hosts:
        - code.frozenf1sh.top
      secretName: code-frozenf1sh-top-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: fish-interview
  labels:
    app.kubernetes.io/name: fish-interview
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: fish-interview
  labels:
    app.kubernetes.io/name: fish-interview
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fish-interview
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
